[project]
name = "wholesale-orders-api"
version = "0.2.0"
description = "Orders API for a fruit & vegetable wholesaler"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, naming
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["B008"]  # FastAPI's Depends()/Query() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
